<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Уличный аудиоархив. Введите код со стикера, чтобы услышать город.">
  <title>УЛИЦЫ ШЕПЧУТ — уличный аудиоархив</title>
  <style>
    @font-face {
      font-family: "Shantell Sans";
      src: url("assets/fonts/ShantellSans-Variable.ttf") format("truetype");
      font-style: normal;
      font-weight: 300 800;
      font-display: swap;
    }

    :root {
      --city: #151515;
      --city-light: #252525;
      --paper: #f7f7f3;
      --paper-dark: #e6e6df;
      --ink: #11110f;
      --ink-soft: #55534d;
      --green: #23743a;
      --red: #a3312b;
      --display-font: "Shantell Sans", "Arial Narrow", Arial, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--city); }

    body {
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 14% 23%, rgba(255,255,255,.055) 0 1px, transparent 2px),
        radial-gradient(ellipse at 78% 69%, rgba(255,255,255,.04) 0 1.5px, transparent 2.5px),
        linear-gradient(106deg, transparent 0 31%, rgba(255,255,255,.025) 31.2% 31.35%, transparent 31.55%),
        linear-gradient(14deg, transparent 0 67%, rgba(0,0,0,.24) 67.15% 67.5%, transparent 67.8%),
        radial-gradient(ellipse at 50% 20%, var(--city-light), var(--city) 64%);
      background-size: 157px 113px, 223px 179px, 620px 470px, 830px 610px, 100% 100%;
      color: var(--ink);
      font-family: "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      opacity: .3;
      background:
        repeating-linear-gradient(167deg, transparent 0 17px, rgba(255,255,255,.018) 18px, transparent 19px 31px),
        radial-gradient(circle at 50% 35%, transparent 0 32%, rgba(0,0,0,.65) 100%);
      mix-blend-mode: screen;
    }

    button, input { font: inherit; }

    button { touch-action: manipulation; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .screen {
      width: 100%;
      min-height: 100svh;
      position: relative;
      z-index: 1;
      transition: opacity .28s ease, transform .28s ease, visibility .28s;
    }

    .screen[hidden] { display: none; }

    .screen.is-leaving {
      opacity: 0;
      transform: translateY(-10px);
      visibility: hidden;
    }

    .screen.is-entering {
      opacity: 0;
      transform: translateY(10px);
    }

    .access-screen {
      display: grid;
      place-items: center;
      padding: calc(38px + var(--safe-top)) 20px calc(38px + var(--safe-bottom));
    }

    .terminal {
      width: min(100%, 520px);
      position: relative;
      padding: clamp(25px, 6vw, 40px) clamp(20px, 6vw, 36px) 30px;
      border: 3px solid var(--ink);
      border-radius: 2% 4% 2% 3% / 3% 2% 4% 2%;
      background:
        radial-gradient(ellipse 78% 42% at 4% 3%, rgba(255,255,255,.82), transparent 72%),
        radial-gradient(ellipse 56% 72% at 104% 68%, rgba(17,17,15,.035), transparent 73%),
        radial-gradient(ellipse 66% 34% at 28% 108%, rgba(17,17,15,.022), transparent 68%),
        linear-gradient(97deg, transparent 0 47%, rgba(17,17,15,.014) 49%, rgba(255,255,255,.32) 50%, transparent 52%),
        var(--paper);
      outline: 2px solid var(--ink);
      outline-offset: 5px;
      box-shadow: 11px 13px 0 rgba(0,0,0,.58), 0 0 0 9px var(--paper);
      text-align: left;
      transform: rotate(-.7deg) skewY(-.18deg);
    }

    .terminal::before,
    .terminal::after {
      content: "";
      position: absolute;
      z-index: 2;
      height: 16px;
      border-top: 3px solid var(--ink);
      border-radius: 50%;
      opacity: .9;
    }

    .terminal::before { width: 38%; top: 17px; right: 24px; transform: rotate(-2deg); }
    .terminal::after { width: 24%; right: 22px; bottom: 18px; transform: rotate(2deg); }

    .terminal form { position: relative; z-index: 3; }

    .eyebrow {
      display: inline-block;
      margin: 0 0 24px;
      padding: 6px 9px 5px;
      background: var(--ink);
      color: var(--paper);
      font-family: "Courier New", monospace;
      font-size: .66rem;
      font-weight: 700;
      letter-spacing: .13em;
      transform: rotate(1.4deg) skewX(-2deg);
      box-shadow: 3px 2px 0 rgba(17,17,15,.18);
    }

    .prompt {
      margin: 0 auto 18px;
      max-width: 19ch;
      color: var(--ink);
      position: relative;
      font-family: var(--display-font);
      font-size: clamp(1.45rem, 6.8vw, 2.35rem);
      font-weight: 650;
      line-height: 1;
      letter-spacing: -.04em;
      text-transform: uppercase;
      transform: rotate(-.5deg);
      text-align: center;
    }

    .prompt,
    .code-input,
    .record-label-title,
    .print-button,
    .track-title {
      font-variation-settings: "wght" 660, "BNCE" -18, "INFM" 76, "SPAC" 2;
      font-feature-settings: "rlig" 1, "case" 1;
    }

    .prompt::after {
      content: "";
      position: absolute;
      left: 8%;
      bottom: -9px;
      width: 84%;
      height: 8px;
      border-top: 4px solid var(--ink);
      border-radius: 50%;
      transform: rotate(-1deg);
    }

    .prompt-brackets {
      display: block;
      margin-top: 18px;
      font-family: var(--display-font);
      font-size: .92em;
      letter-spacing: .12em;
      color: var(--ink);
      text-shadow: 2px 2px 0 rgba(17,17,15,.14);
    }

    .code-wrap {
      width: 112px;
      margin: 5px auto 2px;
      position: relative;
    }

    .code-wrap::after {
      content: "";
      position: absolute;
      inset: auto 5px 2px 2px;
      height: 4px;
      z-index: 2;
      border: 0;
      border-top: 3px solid var(--ink);
      border-radius: 50%;
      pointer-events: none;
      transform: rotate(-1deg);
    }

    .code-input {
      width: 100%;
      height: 57px;
      border: 0;
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      caret-color: var(--ink);
      font-family: var(--display-font);
      font-size: 2.7rem;
      font-weight: 720;
      letter-spacing: .22em;
      text-align: center;
      text-indent: .22em;
      box-shadow: none;
      transition: background .15s, box-shadow .15s, transform .15s;
    }

    .code-input::placeholder { color: rgba(17,17,15,.38); opacity: 1; }

    .code-input:focus {
      background: transparent;
      box-shadow: none;
      transform: scale(1.04);
    }

    .code-input.is-error {
      color: var(--paper);
      border-color: var(--ink);
      background: var(--ink);
      animation: error-flash .34s steps(2, end) 2;
      box-shadow: 5px 5px 0 rgba(17,17,15,.35);
    }

    .access-record {
      --input-turn: 0deg;
      width: min(76vw, 330px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      position: relative;
      border: 3px solid var(--ink);
      border-radius: 44% 56% 47% 53% / 53% 45% 55% 47%;
      background:
        radial-gradient(circle at 49% 48%, transparent 0 17%, rgba(255,255,255,.13) 17.5% 18%, transparent 18.5% 32%, rgba(255,255,255,.09) 32.5% 33%, transparent 33.5%),
        repeating-radial-gradient(ellipse at 49% 51%, #0b0b0a 0 2px, #282825 2.5px 4px, #10100f 4.5px 7px);
      outline: 2px solid var(--ink);
      outline-offset: 5px;
      box-shadow: 0 0 0 9px var(--paper), 0 0 0 12px var(--ink), 11px 14px 0 rgba(17,17,15,.3);
      transform: rotate(var(--input-turn));
      transition: transform .3s cubic-bezier(.2,.8,.3,1);
    }

    .access-record::before {
      content: "";
      position: absolute;
      inset: 4% 6% 5% 3%;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 47% 53% 44% 56% / 56% 46% 54% 44%;
      background:
        conic-gradient(from 17deg, transparent 0 9%, rgba(255,255,255,.14) 9.3% 9.7%, transparent 10% 43%, rgba(255,255,255,.09) 43.2% 43.5%, transparent 44% 81%, rgba(255,255,255,.1) 81.2% 81.6%, transparent 82% 100%);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .access-record::after {
      content: "";
      position: absolute;
      width: 8px;
      aspect-ratio: 1;
      z-index: 4;
      border-radius: 50%;
      background: var(--ink);
      pointer-events: none;
    }

    .access-record.is-connecting { animation: access-record-spin .72s cubic-bezier(.35,.05,.2,1) both; }

    @keyframes access-record-spin {
      from { transform: rotate(var(--input-turn)); }
      to { transform: rotate(calc(var(--input-turn) + 360deg)); }
    }

    .record-label {
      width: 48%;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 3;
      padding: 14px 10px;
      border: 3px solid var(--ink);
      border-radius: 46% 54% 49% 51% / 53% 47% 55% 45%;
      background:
        radial-gradient(ellipse 72% 44% at 24% 6%, rgba(255,255,255,.78), transparent 72%),
        radial-gradient(ellipse 54% 68% at 105% 76%, rgba(17,17,15,.035), transparent 74%),
        var(--paper);
      color: var(--ink);
      text-align: center;
    }

    .record-label-title {
      font-family: var(--display-font);
      font-size: clamp(.72rem, 3.2vw, 1rem);
      font-weight: 640;
      line-height: 1;
      transform: rotate(-2deg);
    }

    .record-label-note {
      font-family: "Courier New", monospace;
      font-size: .5rem;
      font-weight: 700;
      letter-spacing: .1em;
    }

    .random-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 2px 0 14px;
      font-family: "Courier New", monospace;
      font-size: .64rem;
      font-weight: 700;
      letter-spacing: .06em;
      transform: rotate(-.5deg);
    }

    .dice {
      width: 24px;
      aspect-ratio: 1;
      position: relative;
      border: 2px solid var(--ink);
      border-radius: 25% 17% 23% 14%;
      transform: rotate(-7deg);
    }

    .dice::before {
      content: "";
      position: absolute;
      top: 5px;
      left: 5px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--ink);
      box-shadow: 9px 0 var(--ink), 0 9px var(--ink), 9px 9px var(--ink);
    }

    @keyframes error-flash {
      0%, 100% { opacity: 1; transform: translateX(0); }
      35% { opacity: .42; transform: translateX(-4px); }
      70% { opacity: 1; transform: translateX(4px); }
    }

    .print-button {
      width: 100%;
      min-height: 58px;
      padding: 14px 16px;
      border: 3px solid var(--ink);
      border-radius: 3% 2% 4% 2% / 8% 5% 7% 5%;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      font-family: var(--display-font);
      font-size: 1.3rem;
      font-weight: 680;
      line-height: 1;
      letter-spacing: .06em;
      text-transform: uppercase;
      box-shadow: 5px 5px 0 var(--ink);
      transition: color .12s, background .12s, box-shadow .12s, transform .1s;
      transform: rotate(.35deg);
    }

    .print-button:active {
      transform: translate(4px, 4px) rotate(.35deg);
      background: var(--ink);
      color: var(--paper);
      box-shadow: 1px 1px 0 rgba(17,17,15,.3);
    }

    .print-button:focus-visible,
    .play-button:focus-visible,
    .back-button:focus-visible,
    .timeline:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .print-button:disabled { opacity: .48; cursor: wait; }

    .feedback {
      min-height: 2.7em;
      margin: 14px 0 0;
      color: var(--ink-soft);
      font-family: "Courier New", monospace;
      font-size: .68rem;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: .05em;
    }

    .feedback.is-error { color: var(--ink); text-decoration: underline 2px; }
    .feedback.is-loading { color: var(--ink); }

    .track-screen {
      padding: calc(22px + var(--safe-top)) 14px calc(38px + var(--safe-bottom));
    }

    .track-shell {
      width: min(100%, 650px);
      margin: 0 auto;
      padding: 14px 14px 24px;
      position: relative;
      background:
        radial-gradient(ellipse 82% 38% at 82% -8%, rgba(255,255,255,.72), transparent 70%),
        radial-gradient(ellipse 48% 76% at -7% 62%, rgba(17,17,15,.03), transparent 74%),
        radial-gradient(ellipse 72% 42% at 76% 106%, rgba(17,17,15,.022), transparent 69%),
        linear-gradient(8deg, transparent 0 57%, rgba(17,17,15,.012) 59%, rgba(255,255,255,.28) 60%, transparent 63%),
        var(--paper);
      border: 3px solid var(--ink);
      border-radius: 2% 1% 2% 1% / 1% 2% 1% 2%;
      outline: 2px solid var(--ink);
      outline-offset: 5px;
      box-shadow: 12px 14px 0 rgba(0,0,0,.52), 0 0 0 9px var(--paper);
      transform: rotate(.16deg);
    }

    .track-shell::before {
      content: "УЛИЦЫ ШЕПЧУТ / ПОЛЕВОЙ АРХИВ";
      display: block;
      padding: 1px 2px 11px;
      border-bottom: 3px solid var(--ink);
      font-family: "Courier New", monospace;
      font-size: .63rem;
      font-weight: 700;
      letter-spacing: .1em;
      transform: rotate(-.35deg);
    }

    .track-shell::after {
      content: "/////";
      position: absolute;
      z-index: 0;
      top: 2px;
      right: 16px;
      color: var(--ink);
      font-family: "Arial Narrow", Arial, sans-serif;
      font-size: 1.1rem;
      letter-spacing: -.25em;
      transform: rotate(-8deg);
    }

    .photo-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      margin: 14px 0 0;
      padding: 9px 9px 29px;
      overflow: visible;
      background:
        repeating-linear-gradient(135deg, transparent 0 5px, rgba(17,17,15,.32) 6px 7px, transparent 8px 11px) left top / 72px 54px no-repeat,
        repeating-linear-gradient(-45deg, transparent 0 6px, rgba(17,17,15,.28) 7px 8px, transparent 9px 12px) right bottom / 82px 48px no-repeat,
        var(--paper);
      border: 3px solid var(--ink);
      border-radius: 1% 2% 1% 3% / 2% 1% 3% 1%;
      outline: 2px solid var(--ink);
      outline-offset: -7px;
      box-shadow: 5px 6px 0 rgba(17,17,15,.25);
      transform: rotate(-1deg) skewX(.12deg);
    }

    .photo-frame::after {
      content: "АРХИВНАЯ ФОТОФИКСАЦИЯ";
      position: absolute;
      z-index: 3;
      right: 10px;
      bottom: 7px;
      pointer-events: none;
      font-family: "Courier New", monospace;
      font-size: .56rem;
      font-weight: 700;
      letter-spacing: .1em;
    }

    .photo-frame::before {
      content: "";
      position: absolute;
      z-index: 2;
      inset: 9px 9px 29px;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, transparent 0 4px, rgba(255,255,255,.08) 5px, transparent 6px 10px),
        radial-gradient(circle, rgba(0,0,0,.18) 0 .6px, transparent .9px) 0 0 / 4px 4px;
      mix-blend-mode: overlay;
      opacity: .45;
    }

    .photo-frame.is-destroyed::before {
      animation: glitch-overlay 5.2s steps(1, end) infinite;
    }

    .location-photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border: 0;
      filter: grayscale(1) contrast(1.3) brightness(.94);
    }

    .location-photo.is-destroyed {
      filter: grayscale(1) contrast(1.2);
      animation: destroyed-glitch 5.2s steps(1, end) infinite;
    }

    @keyframes destroyed-glitch {
      0%, 88%, 92%, 96%, 100% {
        transform: translate(0, 0) scale(1);
        clip-path: inset(0 0 0 0);
      }
      89% {
        transform: translate(-3px, 1px) scale(1.008);
        clip-path: inset(12% 0 58% 0);
      }
      90% {
        transform: translate(4px, -1px) scale(1.012);
        clip-path: inset(63% 0 10% 0);
      }
      91%, 95% {
        transform: translate(-1px, 0) scale(1.005);
        clip-path: inset(0 0 0 0);
      }
      93% {
        transform: translate(2px, 2px) scale(1.01);
        clip-path: inset(35% 0 34% 0);
      }
      94% {
        transform: translate(-4px, -1px) scale(1.012);
        clip-path: inset(76% 0 5% 0);
      }
    }

    @keyframes glitch-overlay {
      0%, 88%, 92%, 96%, 100% { opacity: 0; transform: translateX(0); }
      89% { opacity: .42; transform: translateX(3px); }
      90% { opacity: .18; transform: translateX(-5px); }
      91% { opacity: .35; transform: translateX(1px); }
      93% { opacity: .48; transform: translateX(-3px); }
      94% { opacity: .22; transform: translateX(5px); }
      95% { opacity: .38; transform: translateX(-1px); }
    }

    .photo-code {
      position: absolute;
      z-index: 4;
      top: 18px;
      left: 18px;
      padding: 6px 8px 5px;
      border: 2px solid var(--ink);
      border-radius: 8% 4% 7% 3% / 7% 5% 8% 4%;
      background: var(--paper);
      color: var(--ink);
      font-family: "Courier New", monospace;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .08em;
      transform: rotate(-2.6deg);
    }

    .track-content { padding: 24px 3px 0; }

    .track-title {
      margin: 0;
      color: var(--ink);
      font-family: var(--display-font);
      font-size: clamp(2.05rem, 10vw, 4.3rem);
      font-weight: 700;
      line-height: .92;
      letter-spacing: -.055em;
      overflow-wrap: anywhere;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 rgba(17,17,15,.13);
      transform: rotate(-.45deg);
    }

    .location {
      display: inline-block;
      margin: 16px 0 26px;
      padding: 6px 8px 5px;
      background: var(--ink);
      color: var(--paper);
      font-family: "Courier New", monospace;
      font-size: .73rem;
      font-weight: 700;
      line-height: 1.5;
      transform: rotate(-.9deg) skewX(-1deg);
    }

    .location::before { content: "МЕСТО // "; color: inherit; }

    .player {
      padding: 16px;
      position: relative;
      border: 3px solid var(--ink);
      border-radius: 2% 1% 3% 1% / 3% 2% 1% 2%;
      outline: 2px solid var(--ink);
      outline-offset: -7px;
      background: rgba(255,255,255,.18);
      box-shadow: inset 0 0 0 2px rgba(17,17,15,.08);
      transform: rotate(.2deg);
    }

    .player-main {
      display: grid;
      grid-template-columns: 94px 1fr;
      align-items: center;
      gap: 18px;
    }

    .play-button {
      width: 94px;
      height: 94px;
      display: grid;
      place-items: center;
      position: relative;
      border: 3px solid var(--ink);
      border-radius: 46% 52% 48% 54% / 51% 45% 55% 49%;
      background:
        radial-gradient(circle at 50% 50%, transparent 0 17%, rgba(255,255,255,.13) 17.5% 18%, transparent 18.5% 32%, rgba(255,255,255,.09) 32.5% 33%, transparent 33.5%),
        repeating-radial-gradient(circle at 50% 50%, #0b0b0a 0 2px, #282825 2.5px 4px, #10100f 4.5px 7px);
      color: var(--ink);
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 1rem;
      box-shadow: 0 0 0 4px var(--paper), 0 0 0 6px var(--ink), 5px 6px 0 rgba(17,17,15,.25);
      transform: rotate(-2deg);
    }

    .play-button::before {
      content: "";
      position: absolute;
      inset: 7%;
      border-radius: inherit;
      background: conic-gradient(from 12deg, transparent 0 31%, rgba(255,255,255,.14) 31.5% 32%, transparent 32.5% 77%, rgba(255,255,255,.1) 77.5% 78%, transparent 78.5%);
      pointer-events: none;
    }

    .play-button:active { filter: invert(1); transform: translate(2px, 2px) rotate(-2deg); }

    .play-button.is-playing { animation: track-record-spin 7s linear infinite; }

    #playIcon {
      width: 42%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      position: relative;
      z-index: 2;
      padding-left: 2px;
      border: 2px solid var(--ink);
      border-radius: 49% 53% 47% 51%;
      background: var(--paper);
      font-size: .9rem;
      font-weight: 700;
    }

    @keyframes track-record-spin {
      from { transform: rotate(-2deg); }
      to { transform: rotate(358deg); }
    }

    .timeline-wrap { min-width: 0; }

    .timeline {
      --progress: 0%;
      width: 100%;
      height: 28px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
    }

    .timeline::-webkit-slider-runnable-track {
      height: 5px;
      background: linear-gradient(to right, var(--ink) var(--progress), #aaa59a var(--progress));
    }

    .timeline::-moz-range-track { height: 5px; background: #aaa59a; }
    .timeline::-moz-range-progress { height: 5px; background: var(--ink); }

    .timeline::-webkit-slider-thumb {
      width: 15px;
      height: 15px;
      margin-top: -6px;
      appearance: none;
      -webkit-appearance: none;
      border: 3px solid var(--ink);
      border-radius: 44% 56% 48% 52%;
      background: var(--paper);
      box-shadow: 2px 2px 0 rgba(17,17,15,.25);
    }

    .timeline::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 3px solid var(--ink);
      border-radius: 44% 56% 48% 52%;
      background: var(--paper);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-top: -2px;
      color: var(--ink-soft);
      font-family: "Courier New", monospace;
      font-size: .66rem;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .audio-message {
      min-height: 1em;
      margin: 10px 0 0 112px;
      color: var(--ink);
      font-family: "Courier New", monospace;
      font-size: .68rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .status-block {
      width: fit-content;
      max-width: 100%;
      margin: 25px 0 28px;
      padding: 10px 13px 9px;
      border: 4px double currentColor;
      border-radius: 3% 1% 4% 2% / 8% 4% 7% 3%;
      background: transparent;
      transform: rotate(-1.35deg);
    }

    .status-label {
      display: block;
      margin-bottom: 7px;
      color: currentColor;
      font-family: "Courier New", monospace;
      font-size: .64rem;
      font-weight: 700;
      letter-spacing: .15em;
    }

    .status-text {
      display: block;
      font-family: "Courier New", monospace;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: .08em;
      overflow-wrap: anywhere;
    }

    .status-block.is-alive { color: var(--green); }
    .status-block.is-destroyed { color: var(--red); }
    .status-block.is-unknown { color: var(--ink-soft); }

    .share-button {
      width: 100%;
      min-height: 48px;
      margin: -14px 0 28px;
      border: 3px solid var(--ink);
      border-radius: 2% 4% 2% 3% / 9% 5% 8% 4%;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-family: "Courier New", monospace;
      font-size: .76rem;
      font-weight: 900;
      letter-spacing: .09em;
      text-transform: uppercase;
      box-shadow: 4px 4px 0 rgba(17,17,15,.2);
      transition: color .12s, background .12s, box-shadow .12s, transform .1s;
      transform: rotate(-.25deg);
    }

    .share-button:active {
      transform: translate(3px, 3px) rotate(-.25deg);
      background: var(--ink);
      color: var(--paper);
      box-shadow: 1px 1px 0 rgba(17,17,15,.2);
    }

    .share-button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .copy-toast {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: calc(22px + var(--safe-bottom));
      width: max-content;
      max-width: calc(100% - 40px);
      padding: 11px 14px;
      border: 3px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      font-family: "Courier New", monospace;
      font-size: .7rem;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: .04em;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity .2s ease, transform .2s ease;
      box-shadow: 5px 5px 0 rgba(0,0,0,.45);
    }

    .copy-toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .back-button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-top: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-family: "Courier New", monospace;
      font-size: .74rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .back-button:active { background: var(--ink); color: var(--paper); }

    @media (min-width: 620px) {
      .track-screen { padding-top: calc(36px + var(--safe-top)); }
      .track-shell { padding: 18px 18px 30px; }
      .track-content { padding-inline: 8px; }
      .print-button:hover,
      .share-button:hover { background: var(--paper); color: var(--ink); box-shadow: 7px 7px 0 var(--ink); transform: translate(-2px, -2px); }
      .play-button:hover { filter: brightness(1.2); }
    }

    @media (max-width: 380px) {
      .access-screen { padding-inline: 13px; }
      .terminal { padding-inline: 18px; }
      .track-screen { padding-inline: 8px; }
      .track-shell { padding-inline: 9px; }
      .player { padding: 12px; }
      .player-main { grid-template-columns: 76px 1fr; gap: 13px; }
      .play-button { width: 76px; height: 76px; }
      .audio-message { margin-left: 89px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="screen access-screen" id="accessScreen" aria-labelledby="accessTitle">
      <div class="terminal">
        <p class="eyebrow">УЛИЦЫ ШЕПЧУТ / ГОРОДСКОЙ КАНАЛ</p>
        <h1 class="prompt" id="accessTitle">
          Введи код с уличного стикера
        </h1>

        <form id="codeForm" novalidate>
          <div class="access-record" id="accessRecord">
            <div class="record-label">
              <span class="record-label-title" aria-hidden="true"></span>
              <div class="code-wrap">
                <label for="codeInput" class="visually-hidden">Двузначный номер трека</label>
                <input
                  class="code-input"
                  id="codeInput"
                  name="code"
                  type="text"
                  inputmode="numeric"
                  pattern="[0-9]{2}"
                  maxlength="2"
                  autocomplete="off"
                  enterkeyhint="go"
                  aria-describedby="feedback"
                  placeholder="__"
                  autofocus
                >
              </div>
              <span class="record-label-note" aria-hidden="true">КОД СТИКЕРА</span>
            </div>
          </div>
          <p class="random-note"><span class="dice" aria-hidden="true"></span><strong>00</strong> — СЛУЧАЙНАЯ УЛИЦА</p>
          <button class="print-button" id="connectButton" type="submit">
            Слушать улицу
          </button>
          <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <section class="screen track-screen" id="trackScreen" aria-labelledby="trackTitle" hidden>
      <article class="track-shell">
        <div class="photo-frame">
          <img class="location-photo" id="locationPhoto" src="" alt="" decoding="async">
          <span class="photo-code" id="photoCode"></span>
        </div>

        <div class="track-content">
          <h2 class="track-title" id="trackTitle"></h2>
          <p class="location" id="trackLocation"></p>

          <div class="player">
            <audio id="audio" preload="metadata"></audio>
            <div class="player-main">
              <button class="play-button" id="playButton" type="button" aria-label="Воспроизвести">
                <span id="playIcon" aria-hidden="true">▶</span>
              </button>
              <div class="timeline-wrap">
                <input class="timeline" id="timeline" type="range" min="0" max="100" value="0" step="0.1" aria-label="Позиция в треке">
                <div class="time-row" aria-live="off">
                  <span id="currentTime">00:00</span>
                  <span id="duration">--:--</span>
                </div>
              </div>
            </div>
            <p class="audio-message" id="audioMessage" role="status"></p>
          </div>

          <div class="status-block is-unknown" id="statusBlock">
            <span class="status-label">СТАТУС_ОБЪЕКТА</span>
            <span class="status-text" id="statusText"></span>
          </div>

          <button class="share-button" id="shareButton" type="button" aria-label="Поделиться текущим треком">
            ↗ Поделиться звуком
          </button>

          <button class="back-button" id="backButton" type="button">← Вернуться в город</button>
        </div>
      </article>
    </section>
  </main>

  <div class="copy-toast" id="copyToast" role="status" aria-live="polite">
    Ссылка скопирована в буфер
  </div>

  <script>
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdv162_Q1nZ1yX5qUpynfjhyrdzPMb4p5CHxHsHGRRjBgXLsuygOZgIBr8jCLaAr8dvNHmJWmDuEnH/pub?output=csv";

    const accessScreen = document.getElementById("accessScreen");
    const trackScreen = document.getElementById("trackScreen");
    const codeForm = document.getElementById("codeForm");
    const codeInput = document.getElementById("codeInput");
    const accessRecord = document.getElementById("accessRecord");
    const connectButton = document.getElementById("connectButton");
    const feedback = document.getElementById("feedback");
    const locationPhoto = document.getElementById("locationPhoto");
    const photoCode = document.getElementById("photoCode");
    const trackTitle = document.getElementById("trackTitle");
    const trackLocation = document.getElementById("trackLocation");
    const statusBlock = document.getElementById("statusBlock");
    const statusText = document.getElementById("statusText");
    const audio = document.getElementById("audio");
    const playButton = document.getElementById("playButton");
    const playIcon = document.getElementById("playIcon");
    const timeline = document.getElementById("timeline");
    const currentTime = document.getElementById("currentTime");
    const duration = document.getElementById("duration");
    const audioMessage = document.getElementById("audioMessage");
    const backButton = document.getElementById("backButton");
    const shareButton = document.getElementById("shareButton");
    const copyToast = document.getElementById("copyToast");
    const photoFrame = locationPhoto.closest(".photo-frame");

    let trackDatabase = null;
    let isSeeking = false;
    let currentCode = null;
    let copyToastTimer = null;

    function normalizeCode(value) {
      const digits = String(value ?? "").replace(/\D/g, "").slice(0, 2);
      return digits.length === 1 ? digits.padStart(2, "0") : digits;
    }

    // CSV-парсер поддерживает запятые, кавычки и переносы строк внутри ячеек.
    function parseCSV(csvText) {
      const rows = [];
      let row = [];
      let cell = "";
      let insideQuotes = false;

      for (let i = 0; i < csvText.length; i += 1) {
        const char = csvText[i];
        const next = csvText[i + 1];

        if (char === '"' && insideQuotes && next === '"') {
          cell += '"';
          i += 1;
        } else if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === "," && !insideQuotes) {
          row.push(cell);
          cell = "";
        } else if ((char === "\n" || char === "\r") && !insideQuotes) {
          if (char === "\r" && next === "\n") i += 1;
          row.push(cell);
          if (row.some((value) => value.trim() !== "")) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }

      row.push(cell);
      if (row.some((value) => value.trim() !== "")) rows.push(row);
      return rows;
    }

    function csvToDatabase(csvText) {
      const rows = parseCSV(csvText.replace(/^\uFEFF/, ""));
      if (rows.length < 2) throw new Error("В таблице нет данных");

      const headers = rows[0].map((header) => header.trim().toLowerCase());
      const required = ["code", "title", "location", "status"];
      if (!required.every((header) => headers.includes(header))) {
        throw new Error("Неверные заголовки таблицы");
      }

      return rows.slice(1).reduce((database, values) => {
        const item = {};
        headers.forEach((header, index) => {
          item[header] = (values[index] || "").trim();
        });

        const code = normalizeCode(item.code);
        if (/^\d{2}$/.test(code)) database[code] = { ...item, code };
        return database;
      }, {});
    }

    async function loadTrackDatabase() {
      if (trackDatabase) return trackDatabase;
      if (!GOOGLE_SHEET_CSV_URL || GOOGLE_SHEET_CSV_URL.includes("ССЫЛКА_")) {
        throw new Error("Сначала укажите CSV-ссылку Google Таблицы в коде");
      }

      const response = await fetch(GOOGLE_SHEET_CSV_URL, { cache: "no-store" });
      if (!response.ok) throw new Error(`Google Таблица недоступна (${response.status})`);
      trackDatabase = csvToDatabase(await response.text());
      return trackDatabase;
    }

    function setFeedback(message = "", state = "") {
      feedback.textContent = message;
      feedback.className = `feedback${state ? ` is-${state}` : ""}`;
    }

    function flashInputError(message) {
      setFeedback(message, "error");
      codeInput.classList.remove("is-error");
      void codeInput.offsetWidth;
      codeInput.classList.add("is-error");
      window.setTimeout(() => codeInput.classList.remove("is-error"), 750);
    }

    function transitionScreens(from, to) {
      from.classList.add("is-leaving");
      window.setTimeout(() => {
        from.hidden = true;
        from.classList.remove("is-leaving");
        to.hidden = false;
        to.classList.add("is-entering");
        void to.offsetWidth;
        to.classList.remove("is-entering");
      }, 360);
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "--:--";
      const minutes = Math.floor(seconds / 60);
      const rest = Math.floor(seconds % 60);
      return `${String(minutes).padStart(2, "0")}:${String(rest).padStart(2, "0")}`;
    }

    function updatePlayState() {
      const isPlaying = !audio.paused && !audio.ended;
      playIcon.textContent = isPlaying ? "Ⅱ" : "▶";
      playButton.setAttribute("aria-label", isPlaying ? "Поставить на паузу" : "Воспроизвести");
      playButton.classList.toggle("is-playing", isPlaying);
    }

    function resetPlayer() {
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      timeline.value = 0;
      timeline.style.setProperty("--progress", "0%");
      currentTime.textContent = "00:00";
      duration.textContent = "--:--";
      audioMessage.textContent = "";
      updatePlayState();
    }

    function showTrack(track, isRandom = false) {
      const code = track.code;
      const destroyed = (track.status || "").toUpperCase().includes("УНИЧТОЖЕН");
      currentCode = code;
      document.title = `${track.title || `ТРЕК ${code}`} — УЛИЦЫ ШЕПЧУТ`;
      photoCode.textContent = `ID_${code}`;
      trackTitle.textContent = `${isRandom ? "[СЛУЧАЙНЫЙ ТРЕК] " : ""}${track.title || `ТРЕК ${code}`}`;
      trackLocation.textContent = track.location || "Координаты не указаны";
      locationPhoto.src = `img/photo${code}.jpg`;
      locationPhoto.alt = track.location
        ? `Локация трека: ${track.location}`
        : `Локация трека ${code}`;

      statusText.textContent = track.status || "СТАТУС НЕИЗВЕСТЕН";
      locationPhoto.classList.toggle("is-destroyed", destroyed);
      photoFrame.classList.toggle("is-destroyed", destroyed);

      const upperStatus = (track.status || "").toUpperCase();
      statusBlock.className = "status-block " + (
        upperStatus.includes("УНИЧТОЖЕН") ? "is-destroyed" :
        upperStatus.includes("ЖИВ") ? "is-alive" : "is-unknown"
      );

      resetPlayer();
      audio.src = `audio/track${code}.mp3`;
      audio.load();
      transitionScreens(accessScreen, trackScreen);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openTrack(code, isRandom = false) {
      const normalizedCode = normalizeCode(code);
      const track = trackDatabase?.[normalizedCode];
      if (!track) return false;
      showTrack(track, isRandom);
      return true;
    }

    function getRandomAliveCode(database) {
      const aliveCodes = Object.values(database)
        .filter((track) => !(track.status || "").toUpperCase().includes("УНИЧТОЖЕН"))
        .map((track) => track.code);

      if (!aliveCodes.length) return null;
      return aliveCodes[Math.floor(Math.random() * aliveCodes.length)];
    }

    codeInput.addEventListener("input", () => {
      codeInput.value = codeInput.value.replace(/\D/g, "").slice(0, 2);
      accessRecord.style.setProperty("--input-turn", `${codeInput.value.length * 4}deg`);
      setFeedback();
    });

    codeForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const code = codeInput.value;

      if (!/^\d{2}$/.test(code)) {
        flashInputError("ОШИБКА: ВВЕДИТЕ ДВЕ ЦИФРЫ");
        return;
      }

      accessRecord.classList.remove("is-connecting");
      void accessRecord.offsetWidth;
      accessRecord.classList.add("is-connecting");
      connectButton.disabled = true;
      setFeedback("ПОИСК СИГНАЛА...", "loading");

      try {
        const database = await loadTrackDatabase();
        if (code === "00") {
          const randomCode = getRandomAliveCode(database);
          if (!randomCode) {
            flashInputError("НЕТ ДОСТУПНЫХ ЖИВЫХ ТРЕКОВ");
            return;
          }
          setFeedback("СЛУЧАЙНЫЙ СИГНАЛ НАЙДЕН", "loading");
          openTrack(randomCode, true);
        } else if (!openTrack(code)) {
          flashInputError("СИГНАЛ НЕ НАЙДЕН: ПРОВЕРЬТЕ КОД");
          return;
        }
      } catch (error) {
        console.error(error);
        flashInputError(error.message || "НЕ УДАЛОСЬ ЗАГРУЗИТЬ БАЗУ ТРЕКОВ");
      } finally {
        connectButton.disabled = false;
        window.setTimeout(() => accessRecord.classList.remove("is-connecting"), 760);
      }
    });

    playButton.addEventListener("click", async () => {
      audioMessage.textContent = "";
      if (audio.paused) {
        try {
          await audio.play();
        } catch (error) {
          console.error(error);
          audioMessage.textContent = "АУДИОФАЙЛ НЕ НАЙДЕН ИЛИ НЕДОСТУПЕН";
        }
      } else {
        audio.pause();
      }
    });

    audio.addEventListener("play", updatePlayState);
    audio.addEventListener("pause", updatePlayState);
    audio.addEventListener("ended", updatePlayState);

    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = formatTime(audio.duration);
      timeline.max = Number.isFinite(audio.duration) ? audio.duration : 100;
    });

    audio.addEventListener("timeupdate", () => {
      if (!isSeeking) timeline.value = audio.currentTime;
      currentTime.textContent = formatTime(audio.currentTime);
      const progress = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      timeline.style.setProperty("--progress", `${progress}%`);
    });

    audio.addEventListener("error", () => {
      if (audio.getAttribute("src")) {
        audioMessage.textContent = "АУДИОФАЙЛ НЕ НАЙДЕН: ПРОВЕРЬТЕ ПАПКУ /audio";
      }
    });

    timeline.addEventListener("input", () => {
      isSeeking = true;
      const value = Number(timeline.value);
      currentTime.textContent = formatTime(value);
      const progress = audio.duration ? (value / audio.duration) * 100 : 0;
      timeline.style.setProperty("--progress", `${progress}%`);
    });

    timeline.addEventListener("change", () => {
      if (Number.isFinite(audio.duration)) audio.currentTime = Number(timeline.value);
      isSeeking = false;
    });

    locationPhoto.addEventListener("error", () => {
      locationPhoto.alt = "Фотография локации не найдена";
      locationPhoto.style.opacity = ".18";
    });

    locationPhoto.addEventListener("load", () => {
      locationPhoto.style.opacity = "1";
    });

    function showCopyToast(message = "Ссылка скопирована в буфер") {
      window.clearTimeout(copyToastTimer);
      copyToast.textContent = message;
      copyToast.classList.add("is-visible");
      copyToastTimer = window.setTimeout(() => {
        copyToast.classList.remove("is-visible");
      }, 2400);
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const temporaryInput = document.createElement("textarea");
      temporaryInput.value = text;
      temporaryInput.setAttribute("readonly", "");
      temporaryInput.style.position = "fixed";
      temporaryInput.style.opacity = "0";
      document.body.appendChild(temporaryInput);
      temporaryInput.select();
      const copied = document.execCommand("copy");
      temporaryInput.remove();
      if (!copied) throw new Error("Не удалось скопировать ссылку");
    }

    function getCurrentTrackUrl() {
      return `${window.location.origin}${window.location.pathname}?track=${encodeURIComponent(currentCode)}`;
    }

    shareButton.addEventListener("click", async () => {
      if (!currentCode) return;

      const shareUrl = getCurrentTrackUrl();
      const shareData = {
        title: trackTitle.textContent,
        text: `Послушай этот звук города: ${trackTitle.textContent}`,
        url: shareUrl
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          return;
        } catch (error) {
          if (error.name === "AbortError") return;
          console.warn("Системный шеринг недоступен, копируем ссылку", error);
        }
      }

      try {
        await copyText(shareUrl);
        showCopyToast();
      } catch (error) {
        console.error(error);
        showCopyToast("Не удалось скопировать ссылку");
      }
    });

    backButton.addEventListener("click", () => {
      resetPlayer();
      currentCode = null;
      document.title = "УЛИЦЫ ШЕПЧУТ — уличный аудиоархив";
      const cleanUrl = `${window.location.pathname}${window.location.hash}`;
      window.history.replaceState({}, "", cleanUrl);
      transitionScreens(trackScreen, accessScreen);
      codeInput.value = "";
      accessRecord.style.setProperty("--input-turn", "0deg");
      setFeedback();
      window.setTimeout(() => codeInput.focus({ preventScroll: true }), 420);
    });

    async function initDatabase() {
      const requestedCode = new URLSearchParams(window.location.search).get("track");

      try {
        connectButton.disabled = true;
        if (requestedCode) setFeedback("ЗАГРУЗКА ПЕРЕДАННОГО СИГНАЛА...", "loading");
        await loadTrackDatabase();

        if (requestedCode) {
          const normalizedCode = normalizeCode(requestedCode);
          if (!/^\d{2}$/.test(normalizedCode) || normalizedCode === "00" || !openTrack(normalizedCode)) {
            flashInputError("ТРЕК ИЗ ССЫЛКИ НЕ НАЙДЕН: ВВЕДИТЕ КОД");
          }
        } else {
          setFeedback();
        }
      } catch (error) {
        console.error(error);
        flashInputError(error.message || "НЕ УДАЛОСЬ ЗАГРУЗИТЬ БАЗУ ТРЕКОВ");
      } finally {
        connectButton.disabled = false;
      }
    }

    window.addEventListener("load", initDatabase);
  </script>
</body>
</html>
